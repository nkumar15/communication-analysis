events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Increase upload size limit
    client_max_body_size 50M;

    # CORS headers for all responses
    map $request_method $cors_method {
        OPTIONS 11;
        GET 1;
        POST 1;
        PUT 1;
        PATCH 1;
        DELETE 1;
        default 0;
    }

    # Upstream definitions
    upstream b2b_backend {
        server b2b-api:8000;
    }

    upstream platform_backend {
        server platform-api:8001;
    }

    upstream b2c_backend {
        server b2c-api:8002;
    }

    upstream b2b_domain_backend {
        server b2b-domain-api:8003;
    }

    upstream b2c_domain_backend {
        server b2c-domain-api:8004;
    }

    server {
        listen 8080;
        server_name localhost;

        # Handle preflight OPTIONS requests handled by backend
        # if ($request_method = 'OPTIONS') {
        #    return 204;
        # }

        # Add CORS headers to all responses
        # CORS handled by backend services
        # add_header 'Access-Control-Allow-Origin' '*' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        # add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        # add_header 'Access-Control-Max-Age' '1728000' always;


        # B2B API - Tenant Management
        location /api/b2b/ {
            proxy_pass http://b2b_backend/api/b2b/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Platform API - Admin Operations
        location /api/platform/ {
            proxy_pass http://platform_backend/api/platform/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # B2C API - Workspace Management
        location /api/b2c/ {
            proxy_pass http://b2c_backend/api/b2c/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # B2C Domain API (Finance Trader)
        location /api/domain/finance_trader/ {
            proxy_pass http://b2c_domain_backend/api/domain/finance_trader/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # B2B Domain API (Default/Fallback for now)
        location /api/domain/ {
            proxy_pass http://b2b_domain_backend/api/domain/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Swagger UI for B2B
        location /docs/b2b {
            proxy_pass http://b2b_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Rewrite OpenAPI URL in the HTML
            proxy_set_header Accept-Encoding "";
            sub_filter 'openapi.json' 'docs/b2b/openapi.json';
            sub_filter_once off;
            sub_filter_types *;
        }

        # OpenAPI JSON for B2B
        location /docs/b2b/openapi.json {
            proxy_pass http://b2b_backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Swagger UI for Platform API
        location /docs/platform {
            proxy_pass http://platform_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Rewrite OpenAPI URL in the HTML
            proxy_set_header Accept-Encoding "";
            sub_filter 'openapi.json' 'docs/platform/openapi.json';
            sub_filter_once off;
            sub_filter_types *;
        }

        # OpenAPI JSON for Platform
        location /docs/platform/openapi.json {
            proxy_pass http://platform_backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Swagger UI for B2C API
        location /docs/b2c {
            proxy_pass http://b2c_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Rewrite OpenAPI URL in the HTML
            proxy_set_header Accept-Encoding "";
            sub_filter 'openapi.json' 'docs/b2c/openapi.json';
            sub_filter_once off;
            sub_filter_types *;
        }

        # OpenAPI JSON for B2C
        location /docs/b2c/openapi.json {
            proxy_pass http://b2c_backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Swagger UI for Domain API
        location /docs/domain {
            proxy_pass http://domain_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Rewrite OpenAPI URL in the HTML
            proxy_set_header Accept-Encoding "";
            sub_filter 'openapi.json' 'docs/domain/openapi.json';
            sub_filter_once off;
            sub_filter_types *;
        }

        # OpenAPI JSON for Domain
        location /docs/domain/openapi.json {
            proxy_pass http://domain_backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }


        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Gateway info endpoint
        location /gateway/info {
            access_log off;
            return 200 '{"gateway":"nginx","version":"1.0","upstreams":["b2b","platform","b2c","domain"]}\n';
            add_header Content-Type application/json;
        }
    }
}
