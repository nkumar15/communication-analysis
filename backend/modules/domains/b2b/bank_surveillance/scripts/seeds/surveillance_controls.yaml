surveillance_controls:
  - risk_typology: "Obstruction of Justice"
    risk_indicator: "Evidence Destruction"
    regulatory_reference: "18 U.S. Code § 1519"
    detection_methods: 
      - type: "keyword"
        keywords: ["shred", "shredding", "destroy documents", "delete emails", "wipe the drive"]
    status: "Active"

  - risk_typology: "Financial Fraud"
    risk_indicator: "Mark-to-Market Manipulation"
    regulatory_reference: "SEC Rule 10b-5"
    detection_methods: 
      - type: "keyword"
        keywords: ["mark to market", "mark-to-market", "MTM", "valuation gap", "aggressive accounting"]
    status: "Active"

  - risk_typology: "Conflict of Interest"
    risk_indicator: "Off-Balance Sheet Vehicles"
    regulatory_reference: "FASB Interpretation No. 46"
    detection_methods: 
      - type: "keyword"
        keywords: ["LJM", "Raptor", "Chewco", "JEDI", "Condor", "Whitewing"]
    status: "Active"

  - risk_typology: "Evasion & Secrecy"
    risk_indicator: "Secrecy Language"
    regulatory_reference: "FINRA Rule 3110"
    detection_methods: 
      - type: "keyword"
        keywords: ["don't put this in writing", "delete this", "offline", "personal email"]
    status: "Active"
