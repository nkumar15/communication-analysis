plans:
  - tier_key: starter
    name: Starter
    description: Essential features for small teams
    base_price_monthly: 0
    base_price_yearly: 0
    per_seat_price_monthly: 100000  # $1,000/user/month (SGD)
    per_seat_price_yearly: 1000000  # $10,000/user/year (SGD)
    limits:
      projects: 5
      storage_gb: 10
    features:
      sso: true
      audit_logs: true
      bulk_invite: false
      dedicated_support: false
      custom_branding: false

  - tier_key: professional
    name: Professional
    description: Advanced collaboration and security
    base_price_monthly: 500000  # $5,000/month (SGD)
    base_price_yearly: 5000000  # $50,000/year (SGD)
    per_seat_price_monthly: 200000  # $2,000/user/month (SGD)
    per_seat_price_yearly: 2000000  # $20,000/user/year (SGD)
    limits:
      projects: -1
      storage_gb: 100
    features:
      dedicated_support: true
      custom_branding: true
      # Inherits sso: true, audit_logs: true

  - tier_key: enterprise
    name: Enterprise
    description: Custom solutions for large organizations
    base_price_monthly: 0
    base_price_yearly: 0
    per_seat_price_monthly: 0
    per_seat_price_yearly: 0
    limits:
      projects: -1
      storage_gb: -1
    features:
      bulk_invite: true
      # Inherits sso, audit, support, branding
      plugins:
        - geographic_boundaries
        - hierarchical_teams
        - data_classification
    contact_required: true
