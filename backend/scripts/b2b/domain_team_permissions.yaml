# Domain-Specific Team Role Permissions (Task Management)
# These permissions are added to existing team role definitions
# Implements GRANULAR control (projects vs tasks)

domain_permissions:
  team_manager:
    - resource: projects
      actions: [read, write, delete]
    - resource: tasks
      actions: [read, write, delete]
    - resource: comments
      actions: [read, write, delete]
    - resource: rag_documents
      actions: [read, write, delete]

  team_contributor:
    - resource: projects
      actions: [read]  # Read only!
    - resource: tasks
      actions: [read, write]
    - resource: comments
      actions: [read, write, delete]
    - resource: rag_documents
      actions: [read, write, delete]

  team_reader:
    - resource: projects
      actions: [read]
    - resource: tasks
      actions: [read]
    - resource: comments
      actions: [read]
    - resource: rag_documents
      actions: [read]      
    # No RAG access for team_reader
