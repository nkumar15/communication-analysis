# Domain-Specific Resources (Task Management)
# For different domains (e.g., ecommerce), replace with domain-appropriate resources
# like 'products', 'orders', 'inventory', etc.
# All domain resources are TEAM-LEVEL by default

resources:
  - name: projects
    display_name: Projects
    category: Domain
    description: Project management and team collaboration
    is_system_resource: false
  
  - name: tasks
    display_name: Tasks
    category: Domain
    description: Task tracking and assignment
    is_system_resource: false
  
  - name: comments
    display_name: Comments
    category: Domain
    description: Task comments and discussions
    is_system_resource: false
