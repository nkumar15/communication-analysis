# B2B Role Templates (SaaS Boilerplate)
# These are the default role templates that every tenant gets
# Permissions format: {resource: <name>, actions: [<action1>, <action2>, ...]}

role_templates:
  - name: owner
    display_name: Owner
    description: Primary administrator with total control over account, billing, security, and all features
    is_system_role: true
    is_default: true
    permissions:
      # Analytics & Reporting
      - resource: dashboard
        actions: [read]
      - resource: reports
        actions: [read, export]
      - resource: analytics
        actions: [read]
      
      # User & Access Management
      - resource: users
        actions: [read, write, delete, invite]
      - resource: roles
        actions: [read, write, delete]
      - resource: teams
        actions: [read, write, delete]
      
      # Account & Billing
      - resource: account
        actions: [read, write, delete]
      - resource: billing
        actions: [read, write, manage]
      - resource: invoices
        actions: [read, export]
      
      # Integration & API
      - resource: integrations
        actions: [read, write, delete]
      - resource: webhooks
        actions: [read, write, delete]
      - resource: api_keys
        actions: [read, write, delete]
      
      # Audit & Security
      - resource: audit_logs
        actions: [read, export]
      - resource: security
        actions: [read, write, manage]
      
      # Support & Documentation
      - resource: support
        actions: [read, write]
      - resource: notifications
        actions: [read, write]

  - name: admin
    display_name: Admin
    description: Administrator with management capabilities, but no billing or account deletion access
    is_system_role: true
    is_default: true
    permissions:
      # Analytics & Reporting
      - resource: dashboard
        actions: [read]
      - resource: reports
        actions: [read, export]
      - resource: analytics
        actions: [read]
      
      # User & Access Management
      - resource: users
        actions: [read, write, invite]
      - resource: roles
        actions: [read, write, delete]
      - resource: teams
        actions: [read, write, delete]
      
      # Account & Billing (read-only)
      - resource: account
        actions: [read]
      - resource: billing
        actions: [read]
      - resource: invoices
        actions: [read]
      
      # Integration & API
      - resource: integrations
        actions: [read, write]
      - resource: webhooks
        actions: [read, write]
      - resource: api_keys
        actions: [read, write]
      
      # Audit & Security
      - resource: audit_logs
        actions: [read]
      - resource: security
        actions: [read]
      
      # Support & Documentation
      - resource: support
        actions: [read, write]
      - resource: notifications
        actions: [read, write]

  - name: member
    display_name: Member
    description: Standard team member with operational access to core features
    is_system_role: true
    is_default: true
    permissions:
      # Analytics & Reporting
      - resource: dashboard
        actions: [read]
      - resource: reports
        actions: [read]
      - resource: analytics
        actions: [read]
      
      # User & Access Management (read-only)
      - resource: users
        actions: [read]
      - resource: roles
        actions: [read]
      - resource: teams
        actions: [read]
      
      # Support & Documentation
      - resource: notifications
        actions: [read, write]
      - resource: support
        actions: [read, write]

  - name: viewer
    display_name: Viewer
    description: Read-only access to dashboards, reports, and non-sensitive information
    is_system_role: true
    is_default: true
    permissions:
      # Analytics & Reporting
      - resource: dashboard
        actions: [read]
      - resource: reports
        actions: [read]
      - resource: analytics
        actions: [read]
      
      # User & Access Management (read-only)
      - resource: users
        actions: [read]
      - resource: roles
        actions: [read]
      - resource: teams
        actions: [read]
      
      # Support & Documentation
      - resource: notifications
        actions: [read, write]
