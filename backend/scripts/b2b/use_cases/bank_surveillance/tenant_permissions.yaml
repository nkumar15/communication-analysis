# Bank Surveillance - Tenant Role Permission Overlays
# Adds surveillance permissions to existing base roles (member, viewer)
# Enforces Separation of Duties by restricting IT roles (owner, admin)

tenant_permissions:
  # =========================================================================
  # IT/Platform Roles (Restricted from business data)
  # =========================================================================
  # owner: (Handled by design - No surveillance permissions added)
  # admin: (Handled by design - No surveillance permissions added)
  
  # =========================================================================
  # Standard Base Roles (Read-only business visibility)
  # =========================================================================
  member:
    - resource: communications
      actions: [read]
    - resource: investigations
      actions: [read]
    - resource: alerts
      actions: [read]
    - resource: surveillance_reports
      actions: [read]
  
  viewer:
    - resource: communications
      actions: [read]
    - resource: investigations
      actions: [read]
    - resource: alerts
      actions: [read]
    - resource: surveillance_reports
      actions: [read]
