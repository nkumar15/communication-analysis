geographic_boundaries:
  enforce_strict: true
  global_roles: [surveillance_chief, compliance_officer]
  default_regions:
    - code: US
      name: United States (Global HQ)
      regulatory_jurisdiction: SEC/Fed
    - code: SG
      name: Singapore (APAC Hub)
      regulatory_jurisdiction: MAS
    - code: MY
      name: Malaysia (Wealth Desk)
      regulatory_jurisdiction: BNM
    - code: UK
      name: United Kingdom
      regulatory_jurisdiction: FCA
    - code: HK
      name: Hong Kong
      regulatory_jurisdiction: HKMA



data_classification:
  enforce_strict: true
  sensitivity_levels:
    - name: PUBLIC
      level: 0
      description: Publicly available information
    - name: INTERNAL
      level: 1
      description: Internal use only
    - name: CONFIDENTIAL
      level: 2
      description: Confidential business information
    - name: RESTRICTED
      level: 3
      description: Restricted access, regulatory implications
    - name: TOP_SECRET
      level: 4
      description: Highest sensitivity, executive/whistleblower data
  default_level: INTERNAL

hierarchical_teams:
  max_depth: 3  # Region -> Desk -> Unit
  allow_cross_hierarchy: false
  
  # Org tier definitions (database-driven)
  org_tiers:
    - name: GLOBAL
      display_name: Global
      description: Headquarters, cross-border oversight. Full visibility across all regions.
      hierarchy_order: 1
    - name: REGIONAL
      display_name: Regional
      description: Multi-country management. Oversight of countries within a geographic region.
      hierarchy_order: 2
    - name: COUNTRY
      display_name: Country
      description: Single jurisdiction. Authority within one country.
      hierarchy_order: 3
    - name: BRANCH
      display_name: Branch
      description: Local operational unit. Specific desk or branch operations.
      hierarchy_order: 4
  
  seed_data:
    - name: "Global Surveillance"
      description: "Global Head of Surveillance"
      region_code: "US"
      org_tier: GLOBAL
      children:
        - name: "APAC Surveillance"
          description: "Regional Surveillance for Asia Pacific"
          region_code: "SG"
          org_tier: REGIONAL
          children:
            - name: "SG Desk"
              description: "Singapore Trading Desk Surveillance"
              region_code: "SG"
              org_tier: COUNTRY
            - name: "HK Desk"
              description: "Hong Kong Trading Desk Surveillance"
              region_code: "HK"
              org_tier: COUNTRY
            - name: "MY Desk"
              description: "Malaysia Trading Desk Surveillance"
              region_code: "MY"
              org_tier: COUNTRY
        - name: "EMEA Surveillance"
          description: "Regional Surveillance for Europe, Middle East, Africa"
          region_code: "UK"
          org_tier: REGIONAL
          children: 
            - name: "UK Desk"
              description: "London Trading Desk Surveillance"
              region_code: "UK"
              org_tier: COUNTRY
        - name: "Americas Surveillance"
          description: "Regional Surveillance for North/South America"
          region_code: "US"
          org_tier: REGIONAL
          children:
            - name: "US Desk"
              description: "New York Trading Desk Surveillance"
              region_code: "US"
              org_tier: COUNTRY
