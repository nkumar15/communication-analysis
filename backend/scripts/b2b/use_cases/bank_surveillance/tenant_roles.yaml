# Bank Surveillance - Tenant-Level Roles
# Additional roles beyond the base owner/admin/member/viewer

tenant_roles:
  - name: surveillance_chief
    display_name: Chief Surveillance Officer
    clearance_level: 4  # Top Secret
    bypass_geographic_restrictions: true
    description: C-Suite executive with global oversight of all surveillance operations
    is_system_role: false
    is_default: true
    permissions:
      # Business Surveillance
      - resource: communications
        actions: [read, analyze, flag, export, archive]
      - resource: investigations
        actions: [read, create, assign, investigate, approve, escalate, close, export]
      - resource: alerts
        actions: [read, acknowledge, investigate, escalate, dismiss, export]
      - resource: surveillance_reports
        actions: [read, create, submit, export, archive]
      - resource: watchlist
        actions: [read, create, approve, delete]
      - resource: model_config
        actions: [read, write, train]
      - resource: analytics
        actions: [read, export]
      - resource: data_pipelines
        actions: [read, export]
      - resource: dashboard
        actions: [read]
      # Platform Visibility (No Management)
      - resource: users
        actions: [read]
      - resource: teams
        actions: [read]
      - resource: audit_logs
        actions: [read, export] # Critical for Chief to audit IT
  
  - name: regional_director
    display_name: Regional Surveillance Director
    clearance_level: 3  # Restricted
    description: Senior management overseeing surveillance for a geographic region
    is_system_role: false
    is_default: true
    permissions:
      # Business Surveillance
      - resource: communications
        actions: [read, analyze, flag, export]
      - resource: investigations
        actions: [read, create, assign, investigate, approve, escalate, close, export]
      - resource: alerts
        actions: [read, acknowledge, investigate, escalate, dismiss, export]
      - resource: surveillance_reports
        actions: [read, create, submit, export]
      - resource: watchlist
        actions: [read, approve]
      - resource: model_config
        actions: [read]
      - resource: analytics
        actions: [read, export]
      - resource: dashboard
        actions: [read]
      # Platform Visibility
      - resource: users
        actions: [read]
      - resource: teams
        actions: [read]
  
  - name: head_compliance
    display_name: Head of Compliance
    clearance_level: 4
    bypass_geographic_restrictions: true
    description: Oversight role for regulatory compliance and auditing
    is_system_role: false
    is_default: true
    permissions:
      - resource: communications
        actions: [read, export]
      - resource: investigations
        actions: [read, export]
      - resource: alerts
        actions: [read, export]
      - resource: surveillance_reports
        actions: [read, create, submit, export]
      - resource: dashboard
        actions: [read]
      - resource: reports
        actions: [read, export]
      - resource: audit_logs
        actions: [read, export]
      - resource: watchlist
        actions: [read]
      - resource: analytics
        actions: [read]
