# Bank Surveillance - Team Role Permission Overlays
# Adds surveillance permissions to base team roles (team_manager, team_contributor, team_reader)

team_permissions:
  team_manager:
    - resource: communications
      actions: [read, analyze, flag, export]
    - resource: investigations
      actions: [read, create, assign, approve, close, export]
    - resource: alerts
      actions: [read, acknowledge, investigate, escalate, dismiss]
    - resource: surveillance_reports
      actions: [read, create, export]
  
  team_contributor:
    - resource: communications
      actions: [read, analyze, flag]
    - resource: investigations
      actions: [read, create, investigate]
    - resource: alerts
      actions: [read, acknowledge, investigate]
    - resource: surveillance_reports
      actions: [read]
  
  team_reader:
    - resource: communications
      actions: [read]
    - resource: investigations
      actions: [read]
    - resource: alerts
      actions: [read]
    - resource: surveillance_reports
      actions: [read]
