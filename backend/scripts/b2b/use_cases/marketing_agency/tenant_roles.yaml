tenant_roles:
  - name: agency_owner
    display_name: Agency Owner
    description: Owner with full control over agency operations
    is_system_role: false
    is_default: false
    permissions:
      - resource: campaigns
        actions: [read, write, delete, export, archive]
      - resource: social_posts
        actions: [read, write, delete, publish, schedule, export]
      - resource: creative_assets
        actions: [read, write, delete, export, archive]
      - resource: analytics_reports
        actions: [read, create, export]
      - resource: client_communications
        actions: [read, write, delete, export]
      - resource: dashboard
        actions: [read]
      - resource: users
        actions: [read, write, invite, delete]
      - resource: teams
        actions: [read, write, delete]
      - resource: billing
        actions: [read, write, manage]
  
  - name: agency_admin
    display_name: Agency Administrator
    description: Senior manager with access to all client accounts
    is_system_role: false
    is_default: false
    permissions:
      - resource: campaigns
        actions: [read, write, delete, export]
      - resource: social_posts
        actions: [read, write, delete, publish, schedule, export]
      - resource: creative_assets
        actions: [read, write, delete, export]
      - resource: analytics_reports
        actions: [read, create, export]
      - resource: client_communications
        actions: [read, write, export]
      - resource: dashboard
        actions: [read]
      - resource: users
        actions: [read, write, invite]
      - resource: teams
        actions: [read, write]
  
  - name: account_director
    display_name: Account Director
    description: Senior role managing multiple client accounts
    is_system_role: false
    is_default: false
    permissions:
      - resource: campaigns
        actions: [read, write, export]
      - resource: social_posts
        actions: [read, write, publish, schedule, export]
      - resource: creative_assets
        actions: [read, write, export]
      - resource: analytics_reports
        actions: [read, create, export]
      - resource: client_communications
        actions: [read, write, export]
      - resource: dashboard
        actions: [read]
      - resource: users
        actions: [read]
      - resource: teams
        actions: [read]
