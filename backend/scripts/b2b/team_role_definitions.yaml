# Team Role Definitions
# Default team-level roles with granular permissions
# These roles apply within a specific team context

team_roles:
  - name: team_manager
    display_name: Team Manager
    description: Full management control within the team
    is_system: true
    permissions:
      # Team Management
      - resource: team_members
        actions: [manage]
      - resource: team_settings
        actions: [manage]

  - name: team_contributor
    display_name: Team Contributor
    description: Can contribute to team work but cannot manage team settings
    is_system: true
    permissions:
      # Team Access
      - resource: team_members
        actions: [read]
      - resource: team_settings
        actions: [read]

  - name: team_reader
    display_name: Team Reader
    description: Read-only access to team resources
    is_system: true
    permissions:
      # Team Access (read-only)
      - resource: team_members
        actions: [read]
      - resource: team_settings
        actions: [read]
