# docker-compose.test.yml — Test environment overrides
#
# Redirects all services to saas_test_db so test runs never touch saas_demo_db.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.test.yml [command]
#
# NEVER use this file for demo targets (make b2b-demo-bank).
# Demo targets use plain docker-compose (saas_demo_db).
# Test targets use DC_TEST = docker-compose -f docker-compose.yml -f docker-compose.test.yml.

services:

  dbmigrate:
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/saas_test_db

  b2b-api:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/saas_test_db

  b2b-worker:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/saas_test_db

  b2b-domain-api:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/saas_test_db

  b2b-domain-worker:
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/saas_test_db

  e2e-tests:
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/saas_test_db
      - TEST_DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/saas_test_db
      - ADMIN_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/saas_test_db
