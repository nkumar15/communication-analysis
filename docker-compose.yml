services:

  # ------------------------------------------------------------------------------------
  # INFRA Services
  # ------------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------
  # INFRA Services
  # ------------------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sso_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    ports:
      - "5433:5432"
    volumes:
      - ./backend:/app
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - "-c"
      - "listen_addresses=*"

  redis:
    image: redis:7-alpine
    container_name: sso_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: sso_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # MinIO - Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: sso_minio
    ports:
      - "9000:9000" # API
      - "9005:9001" # Console (mapped to 9005 to avoid conflict if any)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sso_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  # ------------------------------------------------------------------------------------
  # B2B Services
  # ------------------------------------------------------------------------------------
  dbmigrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_dbmigrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - postgres
    command: env ENABLED_PRODUCTS=b2b python /app/migrations/run_migrations.py

  # B2B Worker - Celery Background Tasks
  b2b-api:
    profiles: ["b2b-demo", "dev-full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_api
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=console
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn modules.b2b.main:app --host 0.0.0.0 --port 8000 --reload

  # B2B Worker - Celery Background Tasks
  b2b-worker:
    profiles: ["b2b-demo", "dev-full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_worker
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=console
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
      - postgres
    command: celery -A workers.b2b_worker.celery_app worker --loglevel=info --concurrency=4 -Q celery,emails,audit

  # B2B Domain Microservice - B2B Logic (Bank Surveillance)
  b2b-domain-api:
    profiles: ["b2b-demo", "dev-full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b-domain
    container_name: sso_b2b_domain_api
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=console
      # AI Config
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - EMBEDDING_PROVIDER=openai
      - EMBEDDING_MODEL=text-embedding-3-small
      - HF_HOME=/app/.cache/huggingface
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      minio:
        condition: service_healthy
    command: uvicorn modules.domains.b2b.main:app --host 0.0.0.0 --port 8003 --reload

  # B2B Domain Worker - Background Processing for B2B (RAG)
  b2b-domain-worker:
    profiles: ["b2b-demo", "dev-full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b-domain-worker
    container_name: sso_b2b_domain_worker
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      - postgres
      - redis
    command: celery -A workers.b2b_domain_worker.celery_app worker --loglevel=info --concurrency=1 -Q b2b-domain

  # B2B Frontend - Web UI for Tenants
  frontend-b2b:
    profiles: ["b2b-demo", "dev-full", "test-ui"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PORTAL: b2b
        REACT_APP_API_URL: http://localhost:8080
    container_name: sso_frontend_b2b
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    restart: unless-stopped

  # ------------------------------------------------------------------------------------
  # TESTS Services
  # ------------------------------------------------------------------------------------
  # API Gateway - Routes requests to all microservices

  # ------------------------------------------------------------------------------------
  # TEST Services
  # ------------------------------------------------------------------------------------
  e2e-tests:
    profiles: [ "test-api", "test-ui" ] # test-api: backend pytest only; test-ui: full browser tests
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: sso_e2e_tests
    env_file:
      - ./backend/.env
    environment:
      # Backend services (running in Docker) - use internal service names
      - API_URL=http://b2b-api:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HF_HOME=/app/.cache/huggingface
      # Frontend services (now in Docker) - use internal service names
      - FRONTEND_URL=http://frontend-b2b:3000
      - FRONTEND_URL_B2B=http://frontend-b2b:3000
      - BASE_URL=http://frontend-b2b:3000
      # Database Overrides (Force use of internal docker service 'postgres')
      - DATABASE_URL=postgresql://saas_demo_user:saas_demo_user_password@postgres:5432/saas_demo_db
      - TEST_DATABASE_URL=postgresql+asyncpg://saas_demo_user:saas_demo_user_password@postgres:5432/saas_demo_db
      - ADMIN_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_demo_db}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    command: python -m pytest tests/e2e_browser -v

volumes:
  postgres_data:
  redis_data:
  es_data:
    driver: local
  minio_data:
    driver: local
