services:
  postgres:
    image: postgres:15-alpine
    container_name: sso_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # B2B Microservice - Tenant Management
  b2b-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn services.b2b.main:app --host 0.0.0.0 --port 8000 --reload

  # Platform Microservice - Admin Operations
  platform-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: platform
    container_name: sso_platform_api
    env_file:
      - ./backend/.env
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn services.platform.main:app --host 0.0.0.0 --port 8001 --reload

  # B2C Microservice - Workspace Management
  b2c-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_api
    env_file:
      - ./backend/.env
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn services.b2c.main:app --host 0.0.0.0 --port 8002 --reload

  #  Domain Microservice - Domain Logic
  domain-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: domain
    container_name: sso_domain_api
    env_file:
      - ./backend/.env
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn services.domains.main:app --host 0.0.0.0 --port 8003 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sso_frontend
    ports:
      - "3000:3000"
    environment:
      # Browser runs on host machine, so use localhost URLs
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_PLATFORM_API_URL=http://localhost:8001
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - b2b-api

  e2e-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: sso_e2e_tests
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FRONTEND_URL=http://frontend:3000
      - API_URL=http://b2b-api:8000
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - b2b-api
      - frontend
    command: python -m pytest tests/e2e_browser -v

volumes:
  postgres_data:


