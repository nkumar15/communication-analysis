services:
  postgres:
    image: postgres:15-alpine
    container_name: sso_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    ports:
      - "5433:5432"
    volumes:
      - ./backend:/app
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - "-c"
      - "listen_addresses=*"

  dbmigrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_dbmigrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    command: uvicorn services.b2b.main:app --host 0.0.0.0 --port 9000 --reload

  # B2B Microservice - Tenant Management
  b2b-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn services.b2b.main:app --host 0.0.0.0 --port 8000 --reload

  # Platform Microservice - Admin Operations
  platform-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: platform
    container_name: sso_platform_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn services.platform.main:app --host 0.0.0.0 --port 8001 --reload

  # B2C Microservice - Workspace Management
  b2c-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn services.b2c.main:app --host 0.0.0.0 --port 8002 --reload

  #  Domain Microservice - Domain Logic
  domain-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: domain
    container_name: sso_domain_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn services.domains.main:app --host 0.0.0.0 --port 8003 --reload

  # Redis - Message Broker for ARQ Background Tasks
  redis:
    image: redis:7-alpine
    container_name: sso_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Celery Worker - Background Task Processor
  # Processes: emails, audit logs, bulk operations
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_celery_worker
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core.tasks.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped

  # API Gateway - Routes requests to all microservices
  nginx:
    image: nginx:alpine
    container_name: sso_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - b2b-api
      - platform-api
      - b2c-api
      - domain-api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sso_frontend
    ports:
      - "3000:3000"
    environment:
      # Browser runs on host machine, so use localhost URLs
      - REACT_APP_API_URL=http://localhost:8080
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - b2b-api

  e2e-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: sso_e2e_tests
    env_file:
      - ./backend/.env
    environment:
      - TEST_DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FRONTEND_URL=http://frontend:3000
      - API_URL=http://b2b-api:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - b2b-api
      - frontend
    command: python -m pytest tests/e2e_browser -v

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: sso_jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sso_prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:


