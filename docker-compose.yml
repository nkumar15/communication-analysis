services:

  # ------------------------------------------------------------------------------------
  # INFRA Services
  # ------------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------
  # INFRA Services
  # ------------------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sso_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    ports:
      - "5433:5432"
    volumes:
      - ./backend:/app
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - "-c"
      - "listen_addresses=*"

  redis:
    image: redis:7-alpine
    container_name: sso_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mailhog - Local Email Testing
  # Web UI: http://localhost:8025
  # SMTP: localhost:1025
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: sso_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Kibana - Elasticsearch Dashboard
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: sso_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # MinIO - Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: sso_minio
    ports:
      - "9000:9000" # API
      - "9005:9001" # Console (mapped to 9005 to avoid conflict if any)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: sso_jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sso_prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: sso_grafana
    ports:
      - "5000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  # Elasticsearch - Vector Store & Search Engine
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sso_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  # B2B Frontend - Web UI for Tenants (E2E Testing Only)
  nginx:
    image: nginx:alpine
    container_name: sso_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - b2b-api
      - platform-api
      - b2c-api
      - b2b-domain-api
      - b2c-domain-api
    restart: unless-stopped

  # ------------------------------------------------------------------------------------
  # B2B Services
  # ------------------------------------------------------------------------------------
  # ------------------------------------------------------------------------------------
  # B2B Services
  # ------------------------------------------------------------------------------------
  dbmigrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_dbmigrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - postgres
    command: uvicorn modules.b2b.main:app --host 0.0.0.0 --port 9000 --reload

  # B2B Worker - Celery Background Tasks
  b2b-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn modules.b2b.main:app --host 0.0.0.0 --port 8000 --reload

  # Platform Microservice - Admin Operations
  b2b-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_worker
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
      - postgres
    command: celery -A workers.b2b_worker.celery_app worker --loglevel=info --concurrency=4 -Q celery,emails,audit

  # B2C Worker - Celery Background Tasks for B2C
  b2b-domain-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b-domain
    container_name: sso_b2b_domain_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
      # AI Config
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - EMBEDDING_PROVIDER=openai
      - EMBEDDING_MODEL=text-embedding-3-small
      - HF_HOME=/app/.cache/huggingface
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn modules.domains.b2b.main:app --host 0.0.0.0 --port 8003 --reload

  # B2C Domain Microservice - B2C Logic (Finance Trader)
  b2b-domain-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b-domain-worker
    container_name: sso_b2b_domain_worker
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A workers.b2b_domain_worker.celery_app worker --loglevel=info --concurrency=1 -Q b2b-domain

  # B2C Domain Worker - Background Processing for B2C (RAG)
  frontend-b2b:
    # profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sso_frontend_b2b
    environment:
      - PORTAL=b2b
      - REACT_APP_API_URL=http://b2b-api:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Don't mount node_modules from host
    depends_on:
      - b2b-api
    restart: unless-stopped
    command: sh -c "npm run build:b2b && npx -y serve -s dist/b2b -l 3000"

  # ------------------------------------------------------------------------------------
  # B2C Services
  # ------------------------------------------------------------------------------------
  # B2C Frontend - Web UI for Workspaces (E2E Testing Only)

  # ------------------------------------------------------------------------------------
  # B2C Services
  # ------------------------------------------------------------------------------------
  b2c-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn modules.b2c.main:app --host 0.0.0.0 --port 8002 --reload

  # B2B Domain Microservice - B2B Logic (Surveillance, Projects)
  b2c-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_worker
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
      - postgres
    command: celery -A workers.b2c_worker.celery_app worker --loglevel=info

  # B2C Beat - Celery Periodic Tasks Scheduler
  b2c-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_beat
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
      - postgres
    command: celery -A workers.b2c_worker.celery_app beat --loglevel=info

  # B2B Microservice - Tenant Management
  b2c-domain-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c-domain
    container_name: sso_b2c_domain_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # AI Config
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - EMBEDDING_PROVIDER=openai
      - EMBEDDING_MODEL=text-embedding-3-small
      - HF_HOME=/app/.cache/huggingface
    ports:
      - "8004:8004"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn modules.domains.b2c.main:app --host 0.0.0.0 --port 8004 --reload

  # B2B Domain Worker - Background Processing for B2B
  b2c-domain-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c-domain-worker
    container_name: sso_b2c_domain_worker
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_SECURE=False
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - EMBEDDING_PROVIDER=openai
      - EMBEDDING_MODEL=text-embedding-3-small
      - HF_HOME=/app/.cache/huggingface
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio
      - elasticsearch
    command: celery -A workers.b2c_domain_worker.celery_app worker --loglevel=info --concurrency=1 -Q b2c-domain

  frontend-b2c:
    # profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sso_frontend_b2c
    environment:
      - PORTAL=b2c
      - REACT_APP_API_URL=http://b2c-api:8002
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - b2c-api
    restart: unless-stopped
    command: sh -c "npm run build:b2c && npx -y serve -s dist/b2c -l 3001"

  # ------------------------------------------------------------------------------------
  # PLATFORM Services
  # ------------------------------------------------------------------------------------
  # Platform Frontend - Admin UI (E2E Testing Only)

  # ------------------------------------------------------------------------------------
  # PLATFORM Services
  # ------------------------------------------------------------------------------------
  platform-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: platform
    container_name: sso_platform_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn modules.platform.main:app --host 0.0.0.0 --port 8001 --reload

  # B2C Microservice - Workspace Management
  frontend-platform:
    # profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sso_frontend_platform
    environment:
      - PORTAL=platform
      - REACT_APP_API_URL=http://platform-api:8001
      - NODE_ENV=production
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - platform-api
    restart: unless-stopped
    command: sh -c "npm run build:platform && npx -y serve -s dist/platform -l 3002"

  # ------------------------------------------------------------------------------------
  # TESTS Services
  # ------------------------------------------------------------------------------------
  # API Gateway - Routes requests to all microservices

  # ------------------------------------------------------------------------------------
  # TEST Services
  # ------------------------------------------------------------------------------------
  e2e-tests:
    # profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: sso_e2e_tests
    env_file:
      - ./backend/.env
    environment:
      # Backend services (running in Docker) - use internal service names
      - API_URL=http://b2b-api:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HF_HOME=/app/.cache/huggingface
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      # Frontend services (now in Docker) - use internal service names
      - FRONTEND_URL=http://frontend-b2b:3000
      - FRONTEND_URL_B2B=http://frontend-b2b:3000
      - FRONTEND_URL_B2C=http://frontend-b2c:3001
      - FRONTEND_URL_PLATFORM=http://frontend-platform:3002
      - BASE_URL=http://frontend-b2b:3000
      # Database Overrides (Force use of internal docker service 'postgres')
      - DATABASE_URL=postgresql://saas_demo_user:saas_demo_user_password@postgres:5432/saas_demo_db
      - TEST_DATABASE_URL=postgresql+asyncpg://saas_demo_user:saas_demo_user_password@postgres:5432/saas_demo_db
      - ADMIN_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_demo_db}
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - b2b-api
      - frontend-b2b
    command: python -m pytest tests/e2e_browser -v


  # Jaeger - Distributed Tracing
volumes:
  postgres_data:
  redis_data:
  grafana_data:
  es_data:
    driver: local
  minio_data:
    driver: local

  kibana_data:
    driver: local
