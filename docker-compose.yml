services:
  postgres:
    image: postgres:15-alpine
    container_name: sso_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    ports:
      - "5433:5432"
    volumes:
      - ./backend:/app
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - "-c"
      - "listen_addresses=*"

  dbmigrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_dbmigrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - postgres
    command: uvicorn modules.b2b.main:app --host 0.0.0.0 --port 9000 --reload

  # B2B Worker - Celery Background Tasks
  b2b-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_worker
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
      - postgres
    command: celery -A workers.b2b_worker.celery_app worker --loglevel=info --concurrency=4 -Q celery,emails,audit

  # B2C Worker - Celery Background Tasks for B2C
  b2c-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_worker
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
      - postgres
    command: celery -A workers.b2c_worker.celery_app worker --loglevel=info

  # B2C Beat - Celery Periodic Tasks Scheduler
  b2c-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_beat
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - redis
      - postgres
    command: celery -A workers.b2c_worker.celery_app beat --loglevel=info

  # B2B Microservice - Tenant Management
  b2b-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2b
    container_name: sso_b2b_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn modules.b2b.main:app --host 0.0.0.0 --port 8000 --reload

  # Platform Microservice - Admin Operations
  platform-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: platform
    container_name: sso_platform_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn modules.platform.main:app --host 0.0.0.0 --port 8001 --reload

  # B2C Microservice - Workspace Management
  b2c-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: b2c
    container_name: sso_b2c_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn modules.b2c.main:app --host 0.0.0.0 --port 8002 --reload

  #  Domain Microservice - Domain Logic
  domain-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: domain
    container_name: sso_domain_api
    env_file:
      - ./backend/.env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_PROVIDER=mailhog
      - MAILHOG_HOST=mailhog
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn modules.domains.main:app --host 0.0.0.0 --port 8003 --reload

  # Redis - Message Broker for ARQ Background Tasks
  redis:
    image: redis:7-alpine
    container_name: sso_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mailhog - Local Email Testing
  # Web UI: http://localhost:8025
  # SMTP: localhost:1025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sso_mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  # B2B Frontend - Web UI for Tenants (E2E Testing Only)
  frontend-b2b:
    profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sso_frontend_b2b
    environment:
      - PORTAL=b2b
      - REACT_APP_API_URL=http://b2b-api:8000
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Don't mount node_modules from host
    depends_on:
      - b2b-api
    restart: unless-stopped

  # B2C Frontend - Web UI for Workspaces (E2E Testing Only)
  frontend-b2c:
    profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sso_frontend_b2c
    environment:
      - PORTAL=b2c
      - REACT_APP_API_URL=http://b2c-api:8002
      - NODE_ENV=development
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - b2c-api
    restart: unless-stopped

  # Platform Frontend - Admin UI (E2E Testing Only)
  frontend-platform:
    profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sso_frontend_platform
    environment:
      - PORTAL=platform
      - REACT_APP_API_URL=http://platform-api:8001
      - NODE_ENV=development
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - platform-api
    restart: unless-stopped

  # API Gateway - Routes requests to all microservices
  nginx:
    image: nginx:alpine
    container_name: sso_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - b2b-api
      - platform-api
      - b2c-api
      - domain-api
    restart: unless-stopped

  e2e-tests:
    profiles: [ "e2e" ] # Only start for E2E tests
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: sso_e2e_tests
    env_file:
      - ./backend/.env
    environment:
      # Backend services (running in Docker) - use internal service names
      - TEST_DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - API_URL=http://b2b-api:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      # Frontend services (now in Docker) - use internal service names
      - FRONTEND_URL=http://frontend-b2b:3000
      - FRONTEND_URL_B2B=http://frontend-b2b:3000
      - FRONTEND_URL_B2C=http://frontend-b2c:3001
      - FRONTEND_URL_PLATFORM=http://frontend-platform:3002
      - BASE_URL=http://frontend-b2b:3000
    volumes:
      - ./backend:/app
      - ./secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      - b2b-api
      - frontend-b2b
    command: python -m pytest tests/e2e_browser -v

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: sso_jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sso_prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: sso_grafana
    ports:
      - "5000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
